<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Delivery - Shopping Cart</title>
    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* ---------- Header ---------- */
        header {
            grid-column: 1 / -1;
            background: #2e7d32;
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        header .cart-icon {
            background: white;
            color: #2e7d32;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header .cart-icon span {
            background: #ff5722;
            color: white;
            border-radius: 50%;
            padding: 2px 10px;
            font-size: 16px;
        }

        /* ---------- Product Grid ---------- */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.2s;
            border: 1px solid #e9ecef;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .product-card .emoji {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .product-card .price {
            color: #2e7d32;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 14px;
        }

        .product-card .price span {
            font-weight: 400;
            font-size: 14px;
            color: #888;
        }

        .add-to-cart-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .add-to-cart-btn:hover {
            background: #1b5e20;
        }

        .add-to-cart-btn:active {
            transform: scale(0.96);
        }

        /* ---------- Cart Sidebar ---------- */
        .cart-sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar h2 {
            font-size: 22px;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }

        .cart-sidebar h2 small {
            font-size: 16px;
            font-weight: 400;
            color: #888;
        }

        #cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        .empty-cart {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 30px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f3f5;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-name {
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 14px;
            color: #555;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-item-actions button {
            background: #e9ecef;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .cart-item-actions button:hover {
            background: #dee2e6;
        }

        .cart-item-actions button:active {
            transform: scale(0.92);
        }

        .cart-item-actions span {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
        }

        .cart-total {
            border-top: 2px solid #f1f3f5;
            padding-top: 16px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .cart-total span {
            color: #2e7d32;
        }

        .checkout-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: #e64a19;
        }

        .checkout-btn:active {
            transform: scale(0.97);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
            .cart-sidebar {
                position: static;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🌿 Fresh Delivery</h1>
            <div class="cart-icon">
                🛒 Cart
                <span id="cart-count">0</span>
            </div>
        </header>

        <!-- Product List -->
        <section>
            <div class="products" id="product-list">
                <!-- Each product card calls addToCart(name, price) -->
                <div class="product-card">
                    <div class="emoji">🍎</div>
                    <h3>Apples</h3>
                    <div class="price">80 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Apples', 80)">+ Add</button>
                </div>

                <div class="product-card">
                    <div class="emoji">🍌</div>
                    <h3>Bananas</h3>
                    <div class="price">50 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Bananas', 50)">+ Add</button>
                </div>

                <div class="product-card">
                    <div class="emoji">🍊</div>
                    <h3>Oranges</h3>
                    <div class="price">60 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Oranges', 60)">+ Add</button>
                </div>

                <div class="product-card">
                    <div class="emoji">🥑</div>
                    <h3>Avocados</h3>
                    <div class="price">120 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Avocados', 120)">+ Add</button>
                </div>

                <div class="product-card">
                    <div class="emoji">🥛</div>
                    <h3>Milk (1L)</h3>
                    <div class="price">90 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Milk', 90)">+ Add</button>
                </div>

                <div class="product-card">
                    <div class="emoji">🍞</div>
                    <h3>Bread</h3>
                    <div class="price">40 <span>Birr</span></div>
                    <button class="add-to-cart-btn" onclick="addToCart('Bread', 40)">+ Add</button>
                </div>
            </div>
        </section>

        <!-- Shopping Cart Sidebar -->
        <aside class="cart-sidebar">
            <h2>
                Your Cart
                <small id="item-count">0 items</small>
            </h2>
            <div id="cart-items">
                <p class="empty-cart">Your cart is empty.</p>
            </div>
            <div class="cart-total">
                Total: <span id="cart-total">0</span> Birr
            </div>
            <button class="checkout-btn" onclick="alert('Proceed to checkout!')">🛒 Checkout</button>
        </aside>
    </div>

    <!-- ============================================================ -->
    <!--  JAVASCRIPT – The missing piece that makes the "Add" buttons work -->
    <!-- ============================================================ -->
    <script>
        // ---------- Cart Data ----------
        let cart = []; // each item: { name, price, quantity }

        // ---------- Add to Cart ----------
        function addToCart(name, price) {
            // Check if item already exists
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            // Update the UI
            updateCartDisplay();
        }

        // ---------- Remove from Cart ----------
        function removeFromCart(index) {
            const item = cart[index];
            if (!item) return;

            if (item.quantity > 1) {
                item.quantity -= 1;
            } else {
                cart.splice(index, 1);
            }
            updateCartDisplay();
        }

        // ---------- Update Cart UI ----------
        function updateCartDisplay() {
            const cartContainer = document.getElementById('cart-items');
            const totalElement = document.getElementById('cart-total');
            const cartCount = document.getElementById('cart-count');
            const itemCount = document.getElementById('item-count');

            if (!cartContainer || !totalElement) return;

            // If cart is empty
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="empty-cart">Your cart is empty.</p>';
                totalElement.textContent = '0';
                cartCount.textContent = '0';
                itemCount.textContent = '0 items';
                return;
            }

            // Build HTML for each cart item
            let html = '';
            let totalPrice = 0;
            let totalItems = 0;

            cart.forEach((item, index) => {
                totalPrice += item.price * item.quantity;
                totalItems += item.quantity;

                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-name">${item.name}</span>
                            <span class="cart-item-price">${item.price} Birr × ${item.quantity}</span>
                        </div>
                        <div class="cart-item-actions">
                            <button onclick="removeFromCart(${index})">−</button>
                            <span>${item.quantity}</span>
                            <button onclick="addToCart('${item.name}', ${item.price})">+</button>
                        </div>
                    </div>
                `;
            });

            cartContainer.innerHTML = html;
            totalElement.textContent = totalPrice;
            cartCount.textContent = totalItems;
            itemCount.textContent = `${totalItems} item${totalItems > 1 ? 's' : ''}`;
        }

        // ---------- Optional: Clear cart (not used, but can be added) ----------
        // function clearCart() { cart = []; updateCartDisplay(); }

        // Initialize display on page load
        updateCartDisplay();
    </script>

</body>
</html>
